name: Publish signed app update feed
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 1'
permissions:
  contents: write
concurrency:
  group: signed-app-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==44.0.3
      - name: Sign release metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('update-key.pem').write_text(os.environ['UPDATE_SIGNING_KEY'])
          PY
          python tools/updates/publish.py --key update-key.pem
          rm update-key.pem
      - name: Publish feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add updates/stable.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh signed app update feed'
          git pull --rebase origin main
          git push origin main
