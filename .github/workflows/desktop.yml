name: Standalone Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'branding/streamnest-icon.svg'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'branding/streamnest-icon.svg'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tool dependencies
        run: npm ci --prefix desktop/packaging --ignore-scripts
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: reference/desktop-toolchain
          key: desktop-toolchain-${{ hashFiles('desktop/packaging/toolchain.json') }}
      - name: Desktop logic and isolation tests
        run: node --test desktop/tests/*.test.js tools/catalog/*.test.mjs
      - name: Build from pinned sources and frozen dependencies
        run: python desktop/packaging/build.py
      - name: Read desktop package version
        run: |
          $desktopVersion = (Get-Content desktop/packaging/package.json -Raw | ConvertFrom-Json).version
          "SN_DESKTOP_VERSION=$desktopVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify package identity and clean payload
        run: python desktop/packaging/verify.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest"
      - name: Hidden clean-profile renderer check
        run: python desktop/packaging/smoke.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest"
      - name: Home, synced progress and existing title flow
        run: python desktop/packaging/smoke.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest" --home
      - name: Trailer controls and external handoff
        run: python desktop/packaging/smoke.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest" --trailers
      - name: Native update helper and restart
        run: python desktop/packaging/handoff_smoke.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest"
      - name: Settings sync dialog and disposable live pairing
        run: python desktop/packaging/smoke.py --app "reference/standalone-build/$env:SN_DESKTOP_VERSION/StreamNest" --sync
      - name: Per-user install and safe uninstall
        run: python desktop/packaging/test_installer.py --installer "dist/standalone/StreamNest-Desktop-$env:SN_DESKTOP_VERSION-win-x64-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: streamnest-desktop-win-x64
          path: dist/standalone/*
